services:
  vpnmanager:
    build: .
    image: vpnmanager:latest
    container_name: vpnmanager
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8443}:8443"
    environment:
      # Optional – ohne Wert wird beim ersten Start ein Schlüssel im Volume erzeugt (/data/.secret_key)
      SECRET_KEY: ${SECRET_KEY:-}
      APP_TITLE: ${APP_TITLE:-VPN-Manager}
      TZ: ${TZ:-Europe/Berlin}
      TLS_ENABLED: ${TLS_ENABLED:-true}
    volumes:
      - vpnmanager-data:/data

volumes:
  vpnmanager-data:
